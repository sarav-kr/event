<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Enquiries | The Sneh Moments</title>
    <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
<header class="topbar">
    <div>
        <p class="eyebrow">The Sneh Moments</p>
        <h1>Contact Enquiries</h1>
    </div>
    <button id="refreshBtn" type="button">Refresh</button>
</header>

<main>
    <section class="summary">
        <div>
            <span id="totalCount">0</span>
            <p>Total enquiries</p>
        </div>
        <div>
            <span id="latestDate">-</span>
            <p>Latest submission</p>
        </div>
    </section>

    <section class="panel">
        <div class="panel-head">
            <h2>Recent Requests</h2>
            <p>Messages submitted from the public contact form.</p>
        </div>
        <div id="statusMessage" class="status">Loading enquiries...</div>
        <div id="inquiriesList" class="inquiries-list"></div>
    </section>
</main>

<script src="/admin/admin.js"></script>
</body>
</html>
